name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # Allowed: the SVG namespace, the placeholder in the options form, and plain
      # links (not requests) to the project's own Terms/Privacy pages.
      - name: No external URLs in the build
        run: |
          found=$(grep -rhoE "https?://[a-zA-Z0-9./*_-]+" dist --include='*.js' --include='*.html' --include='*.css' \
            | grep -vE '^http://www\.w3\.org/2000/svg$|^https://canvas\.myuniversity\.edu$|^https://davidmenendez9901\.github\.io/assignment-tracker-for-canvas/(terms|privacy)\.html$' || true)
          if [ -n "$found" ]; then echo "Unexpected URLs in build:"; echo "$found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
