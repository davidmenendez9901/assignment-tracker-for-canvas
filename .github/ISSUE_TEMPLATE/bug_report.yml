name: Bug report
description: Something doesn't work or shows the wrong status.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't include grades, names, course names, or other personal data.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: assignment
    attributes:
      label: Assignment settings (if a status looks wrong)
      description: e.g. "100 pts, due yesterday, available until next week, online upload, I submitted late". No names.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131 / Firefox 140
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Canvas address type
      options:
        - "*.instructure.com"
        - Custom domain
    validations:
      required: true
