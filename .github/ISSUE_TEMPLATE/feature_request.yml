name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This keeps the extension read-only, local-only, and free of telemetry (see CONTRIBUTING.md).
          required: true
