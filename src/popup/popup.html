<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assignment Tracker for Canvas</title>
    <link rel="stylesheet" href="../ui.css" />
  </head>
  <body class="popup">
    <main>
      <h1>Assignment Tracker</h1>
      <p id="status" role="status" aria-live="polite">Checking this tab…</p>
      <button id="enable" type="button" hidden>Enable on this site</button>
      <p><a id="manage" href="#">Manage Canvas sites</a></p>
      <p class="fine">Read-only. No data leaves your browser.<br />Not affiliated with Instructure.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
